name: Refresh example (self-updating)

on:
  schedule:
    - cron: '17 6 * * 1'  # every Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-example
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install .

      - name: Regenerate the Reliance example with current market data
        run: technical-brief RELIANCE --market in --out examples/reliance

      - name: Commit the refreshed example if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/reliance
          if git diff --cached --quiet; then
            echo "No change in today's output; nothing to commit."
            exit 0
          fi
          git commit -m "Refresh Reliance example with current market data [skip ci]"
          git push
